{% set name = "nasm" %}
{% set version = "2.16.03" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://www.nasm.us/pub/{{ name }}/releasebuilds/{{ version }}/{{ name }}-{{ version }}.tar.xz
  sha256: 1412a1c760bbd05db026b6c0d1657affd6631cd0a63cddb6f73cc6d4aa616148

build:
  number: 0
  ignore_run_exports:
    - vc

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - gnuconfig  # [unix]
    - make  # [unix]
    - perl  # [win]
  run:
    # Since there are no shared libraries, we just need to ensure the right runtime.
    - vs2015_runtime  # [win]

test:
  commands:
    - nasm -h
    - ndisasm -h

about:
  home: https://www.nasm.us
  license: BSD-2-Clause
  license_family: BSD
  license_file: LICENSE
  doc_url: https://www.nasm.us/docs.php
  dev_url: https://github.com/netwide-assembler/nasm
  summary: Netwide Assembler - an assembler targetting the Intel x86 series of processors.
  description: |
    Asssembler for the x86 CPU architecture portable to nearly every modern platform, 
    and with code generation for many platforms old and new.

extra:
  recipe-maintainers:
    - jakirkham
